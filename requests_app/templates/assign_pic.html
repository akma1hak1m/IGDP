{% extends "base.html" %}

{% block content %}

<div class="assign-container">

    <h2 class="assign-title section-title">Penugasan PIC</h2>
    <div class="divider-line"></div>

    {% for req in borang_list %}
    <div class="assign-card glass-card">

        <!-- LEFT -->
        <div class="assign-info">
            <h3>{{ req.namapemohon }}</h3>
            <p>{{ req.email }}</p>
            <p>{{ req.borang_type }} NO {{ req.id }}</p>
        </div>

        <!-- RIGHT -->
        <form method="POST" action="{% url 'assign_pic' req.borang_type req.id %}" class="assign-form">
            {% csrf_token %}

            <div class="assign-action">
                <select name="pic" class="assign-select">
                    {% for user in users %}
                        <option value="{{ user.id }}">{{ user.username }}</option>
                    {% endfor %}
                </select>

                <button type="submit" class="assign-btn">
                    Tugaskan
                </button>
            </div>

        </form>

    </div>
    {% empty %}
    <p class="empty-text">Tiada Borang Sedia Untuk Penugasan PIC</p>
    {% endfor %}

</div>
{% endblock %}
