{% load static %}
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lupa Kata Laluan</title>
<link rel="stylesheet" href="{% static 'css/templatemo-nexaverse.css' %}">
</head>

<body>

<div class="ambient-bg">
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
</div>

<div class="grid-overlay"></div>

<div class="header">
<img src="{% static 'images/logomysa.png' %}" class="hero-logo">

<h1 class="brand-name">AGENSI ANGKASA MALAYSIA</h1>
<h1 class="brand-name">(MYSA)</h1>

<p class="tagline">DATA GEOSPATIAL BERSEPADU</p>
</div>

<div class="glass-card login-card">

<h2 class="auth-title">LUPA KATA LALUAN</h2>

<p class="mini-text">
Masukkan email berdaftar untuk reset kata laluan
</p>

<form method="POST">
{% csrf_token %}

<div class="form-group">
<input type="email" name="email" placeholder="Masukkan Email" required>
</div>

<button type="submit" class="submit-btn login-btn">
Hantar Link Reset
</button>

<div class="bottom-link">
    <a href="{% url 'login' %}" class="clean-link">
        ← Kembali ke Login
    </a>
</div>

</form>

</div>

</body>
</html>
