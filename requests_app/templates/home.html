{% extends "base.html" %}
{% load static %}

{% block content %}

<div class="welcome-left fade-in">

    <div class="welcome-label">
        Selamat Datang,
    </div>

    <div class="welcome-name">
        {% if request.user.first_name %}
            {{ request.user.first_name }}
        {% else %}
            {{ request.user.username }}
        {% endif %}
    </div>

</div>

<div class="header fade-in">

<img src="{% static 'images/logomysa.png' %}" class="hero-logo fade-in fade-delay-1">

<h1 class="brand-name fade-in fade-delay-2">
SISTEM DATA GEOSPATIAL BERSEPADU
</h1>

<p class="tagline fade-in fade-delay-3">
AGENSI ANGKASA MALAYSIA (MYSA)
</p>

</div>

<div class="divider-line fade-in fade-delay-3"></div>

<div class="flow-tabs fade-in fade-delay-4">

    <div class="flow-tab-nav">
        <button type="button" class="flow-tab-btn active" data-tab="serah" onclick="switchFlowTab('serah')">
            Carta Alir Serahan Data
        </button>
        <button type="button" class="flow-tab-btn" data-tab="pinjam" onclick="switchFlowTab('pinjam')">
            Carta Alir Pinjaman Data
        </button>
    </div>

    <div class="flow-tab-pane active" data-pane="serah">
        <div class="flow-container">
            <img src="{% static 'images/serahan.jpeg' %}"
            class="flow-image"
            onclick="openImage(this.src)">
        </div>
    </div>

    <div class="flow-tab-pane" data-pane="pinjam">
        <div class="flow-container">
            <img src="{% static 'images/pinjaman.jpeg' %}"
            class="flow-image"
            onclick="openImage(this.src)">
        </div>
    </div>

</div>

<div id="imgModal" class="img-modal" onclick="closeImage()">
    <span class="close-btn">&times;</span>
    <img id="modalImg" class="modal-content">
</div>

<script>
function openImage(src){
    document.getElementById("imgModal").style.display = "flex";
    document.getElementById("modalImg").src = src;
}

function closeImage(){
    document.getElementById("imgModal").style.display = "none";
}

function switchFlowTab(name){
    document.querySelectorAll(".flow-tab-btn").forEach(function(btn){
        btn.classList.toggle("active", btn.dataset.tab === name);
    });
    document.querySelectorAll(".flow-tab-pane").forEach(function(pane){
        pane.classList.toggle("active", pane.dataset.pane === name);
    });
}
</script>

{% endblock %}
